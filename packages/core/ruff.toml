exclude = [
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "__pypackages__",
]
# Allow imports relative to the "verbatim_core" directory.
src = ["verbatim_core"]

line-length = 120
indent-width = 4

output-format = "grouped"
target-version = "py310"

[analyze]
detect-string-imports = true

[lint]
select = ["ALL"]
ignore = [
    "E501", # line-too-long(permanent) (https://docs.astral.sh/ruff/rules/line-too-long/)
    "C901", # complex-structure(deferred) (https://docs.astral.sh/ruff/rules/complex-structure/)
    "CPY001", # missing-copyright-notice(deferred) (https://docs.astral.sh/ruff/rules/missing-copyright-notice/)
]

[lint.per-file-ignores]
## TODO: Refactor design patterns for template management.
"verbatim_core/templates/*.py" = [
    "FBT001", # boolean-type-hint-positional-argument(deferred) (public API) (https://docs.astral.sh/ruff/rules/boolean-type-hint-positional-argument/)
    "FBT002", # boolean-default-value-positional-argument(deferred) (public API) (https://docs.astral.sh/ruff/rules/boolean-default-value-positional-argument/)
    "PLR0913", # too-many-arguments(deferred) (https://docs.astral.sh/ruff/rules/too-many-arguments/)
    "PLR0917", # too-many-positional-arguments(deferred) (https://docs.astral.sh/ruff/rules/too-many-positional-arguments/)
    "PLC0415", # import-outside-top-level(deferred) (optional/lazy dependencies) (https://docs.astral.sh/ruff/rules/import-outside-top-level/)
    "ARG002", # unused-method-argument(deferred) (template interface signatures) (https://docs.astral.sh/ruff/rules/unused-method-argument/)
]
## print statements are used to produce output as a part of a CLI here.
"verbatim_core/cli.py" = [
    "T201", # print(permanent) (https://docs.astral.sh/ruff/rules/print/)
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
# Use double quotes for strings.
quote-style = "double"
# Use the configured quote style for nested strings (Python 3.12+ only).
nested-string-quote-style = "preferred"
# Indent with spaces, rather than tabs.
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending.
line-ending = "auto"

# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
# Format all docstring code snippets with a line length of 60.
docstring-code-line-length = 60
