exclude = [
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "__pypackages__",
]
# Allow imports relative to the "verbatim_core" directory.
src = ["verbatim_core"]

line-length = 120
indent-width = 4

output-format = "grouped"
target-version = "py310"

[analyze]
detect-string-imports = true

[lint]
select = ["ALL"]
ignore = [
    "E501", # line-too-long (https://docs.astral.sh/ruff/rules/line-too-long/)
    "C901", # complex-structure (https://docs.astral.sh/ruff/rules/complex-structure/)
    "CPY001", # missing-copyright-notice
    "FBT001", # boolean-type-hint-positional-argument (public API)
    "FBT002", # boolean-default-value-positional-argument (public API)
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0915", # too-many-statements
    "PLR0912", # too-many-branches
    "A002", # builtin-argument-shadowing (public API, e.g. `filter`)
    "A005", # stdlib-module-shadowing (verbatim_core.types)
    "INP001", # implicit-namespace-package
    "PLC0415", # import-outside-top-level (optional/lazy dependencies)
    "ARG002", # unused-method-argument (template interface signatures)
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
# Use double quotes for strings.
quote-style = "double"
# Use the configured quote style for nested strings (Python 3.12+ only).
nested-string-quote-style = "preferred"
# Indent with spaces, rather than tabs.
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending.
line-ending = "auto"

# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
# Format all docstring code snippets with a line length of 60.
docstring-code-line-length = 60
